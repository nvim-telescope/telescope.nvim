name: Linting and style checking

on:
  push:
    branches:
      - "master"
      - "next"
  pull_request:
    branches:
      - "master"
      - "next"
  workflow_dispatch:

jobs:
  emmylua:
    name: emmylua_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # only for the runtime files (`$VIMRUNTIME`) used as library
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly # TODO: stable once Nvim 0.13 is released

      - name: Lint
        run: make lint

  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --color always --check .
