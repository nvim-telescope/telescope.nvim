name: Tests

on:
  push:
    branches:
      - "master"
      - "next"
  pull_request:
    branches:
      - "master"
      - "next"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  unit_tests:
    name: unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rev: [nightly] # TODO: add stable once Nvim 0.13 is released
        include:
          - os: ubuntu-latest
            install-rg: sudo apt-get update && sudo apt-get install -y ripgrep
          - os: macos-latest
            install-rg: brew update && brew install ripgrep
          - os: windows-latest
            install-rg: choco install ripgrep

    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: |
          ${{ matrix.install-rg }}
          rg --version

      - name: Run tests
        run: make test NVIM_VERSION=${{ matrix.rev }}
